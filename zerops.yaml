zerops:
  - setup: api

    build:
      base: python@3.12
      buildCommands:
        - pip install -r backend/requirements.txt
      deployFiles:
        - ./

    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true

      envVariables:
        DATABASE_URL: ${db_connectionString}

      start: uvicorn backend.main:app --host 0.0.0.0 --port 8000

      healthCheck:
        httpGet:
          port: 8000
          path: /health
