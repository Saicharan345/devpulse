zerops:
  - setup: api

    build:
      base: python@3.12

      buildCommands:
        - python -m pip install -r backend/requirements.txt

      addToRunPrepare:
        - backend/requirements.txt

      deployFiles:
        - backend/~

    run:
      base: python@3.12

      prepareCommands:
        - python -m pip install -r requirements.txt

      ports:
        - port: 8000
          httpSupport: true

      envVariables:
        DATABASE_URL: ${db_connectionString}

      start: uvicorn main:app --host 0.0.0.0 --port 8000

      healthCheck:
        httpGet:
          port: 8000
          path: /health