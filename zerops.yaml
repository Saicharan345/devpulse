zerops:
  - setup: api
    build:
      base: python@3.12

      buildCommands:
        - python3 -m pip install -r backend/requirements.txt

      addToRunPrepare:
        - backend/requirements.txt

      deployFiles:
        - backend/~

    run:
      base: python@3.12

      prepareCommands:
        - python3 -m pip install --ignore-installed -r backend/requirements.txt

      ports:
        - port: 8000
          httpSupport: true

      envVariables:
        DATABASE_URL: ${db_connectionString}

      start: python3 -m uvicorn main:app --host 0.0.0.0 --port 8000

      healthCheck:
        httpGet:
          port: 8000
          path: /health

  - setup: gui
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm ci
        - cd frontend && npm run build
      deployFiles:
        - frontend/dist/~
      cache: frontend/node_modules
    run:
      os: alpine
      base: static